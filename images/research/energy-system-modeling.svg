<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Sector emission pathways converging to net zero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF1F9"/>
      <stop offset="1" stop-color="#D6E4F3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g stroke="#003D7C" stroke-opacity="0.08">
    <path d="M60 60H600M60 120H600M60 180H600M60 240H600"/>
  </g>
  <!-- net-zero baseline -->
  <path d="M60 290H600" stroke="#003D7C" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5"/>
  <text x="596" y="280" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#003D7C" fill-opacity="0.7">net zero</text>
  <!-- sector pathways -->
  <path d="M60 70C200 80 300 150 420 250S560 288 600 290" fill="none" stroke="#003D7C" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 120C190 125 290 190 400 262S560 289 600 290" fill="none" stroke="#2D6FB5" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 165C180 170 280 220 380 270S560 290 600 290" fill="none" stroke="#7FA8D6" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 210C170 215 270 250 360 276S560 290 600 290" fill="none" stroke="#EF7C00" stroke-width="5" stroke-linecap="round"/>
  <g fill="#fff" stroke-width="4">
    <circle cx="60" cy="70" r="9" stroke="#003D7C"/>
    <circle cx="60" cy="120" r="9" stroke="#2D6FB5"/>
    <circle cx="60" cy="165" r="9" stroke="#7FA8D6"/>
    <circle cx="60" cy="210" r="9" stroke="#EF7C00"/>
  </g>
  <circle cx="600" cy="290" r="12" fill="#EF7C00"/>
</svg>
