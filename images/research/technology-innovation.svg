<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Deployment rising while technology costs fall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4E8"/>
      <stop offset="1" stop-color="#FCE3C8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <path d="M70 300H590" stroke="#003D7C" stroke-width="2" stroke-opacity="0.35"/>
  <!-- deployment bars -->
  <g fill="#EF7C00">
    <rect x="90"  y="276" width="40" height="24" rx="6" fill-opacity="0.55"/>
    <rect x="150" y="262" width="40" height="38" rx="6" fill-opacity="0.6"/>
    <rect x="210" y="244" width="40" height="56" rx="6" fill-opacity="0.65"/>
    <rect x="270" y="220" width="40" height="80" rx="6" fill-opacity="0.7"/>
    <rect x="330" y="190" width="40" height="110" rx="6" fill-opacity="0.75"/>
    <rect x="390" y="156" width="40" height="144" rx="6" fill-opacity="0.82"/>
    <rect x="450" y="116" width="40" height="184" rx="6" fill-opacity="0.9"/>
    <rect x="510" y="72"  width="40" height="228" rx="6"/>
  </g>
  <!-- cost curve -->
  <path d="M110 70C200 110 270 160 350 196S480 236 530 242" fill="none" stroke="#003D7C" stroke-width="6" stroke-linecap="round"/>
  <g fill="#fff" stroke="#003D7C" stroke-width="4">
    <circle cx="110" cy="70" r="9"/>
    <circle cx="230" cy="135" r="9"/>
    <circle cx="350" cy="196" r="9"/>
    <circle cx="530" cy="242" r="9"/>
  </g>
  <text x="128" y="58" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#003D7C">cost</text>
  <text x="530" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#B85F00">deployment</text>
</svg>
